name: Build and publish static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

         - run: npm install
         - run: npm run build

      - name: Add .htaccess
        run: |
          cat > out/.htaccess <<'EOF'
          ErrorDocument 404 /404.html
          Options -Indexes
          DirectoryIndex index.html
          EOF

      - name: Publish out/ to deploy branch
        run: |
          cd out
          touch .nojekyll
          git init -b deploy
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -m "Deploy ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy
